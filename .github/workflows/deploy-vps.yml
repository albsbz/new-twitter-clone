name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies for seed
        run: npm ci

      - name: Set image names
        id: image
        run: |
          IMAGE_REPO="${GITHUB_REPOSITORY,,}"
          IMAGE_SHA="${{ env.REGISTRY }}/${IMAGE_REPO}:${GITHUB_SHA}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${IMAGE_REPO}:latest"
          echo "image_sha=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Wait for MongoDB service
        run: |
          MONGO_ID="$(docker ps --filter 'ancestor=mongo:latest' --format '{{.ID}}' | head -n 1)"
          if [ -z "$MONGO_ID" ]; then
            echo "MongoDB service container not found"
            exit 1
          fi

          for i in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$MONGO_ID")"
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
              echo "MongoDB is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become ready in time"
          exit 1

      - name: Seed MongoDB data for build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
          NEXT_PUBLIC_EXTERNAL_URL: ${{ secrets.NEXT_PUBLIC_EXTERNAL_URL }}
          NEXT_PUBLIC_BASIC_URL: ${{ secrets.NEXT_PUBLIC_BASIC_URL }}
        run: npm run seed

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          network: host
          push: true
          tags: |
            ${{ steps.image.outputs.image_sha }}
            ${{ steps.image.outputs.image_latest }}
          build-args: |
            NEXT_PUBLIC_EXTERNAL_URL=${{ secrets.NEXT_PUBLIC_EXTERNAL_URL }}
            NEXT_PUBLIC_BASIC_URL=${{ secrets.NEXT_PUBLIC_BASIC_URL }}
            MONGODB_URI=mongodb://127.0.0.1:27017/new-twitter-clone-build

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy VPS compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: docker-compose.vps.yml,Caddyfile
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NEXT_PUBLIC_EXTERNAL_URL: ${{ secrets.NEXT_PUBLIC_EXTERNAL_URL }}
          NEXT_PUBLIC_BASIC_URL: ${{ secrets.NEXT_PUBLIC_BASIC_URL }}
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: APP_IMAGE,GHCR_USERNAME,GHCR_TOKEN,VPS_APP_DIR,DOMAIN,NEXT_PUBLIC_EXTERNAL_URL,NEXT_PUBLIC_BASIC_URL,MONGO_INITDB_ROOT_USERNAME,MONGO_INITDB_ROOT_PASSWORD,MONGODB_URI,JWT_SECRET,EMAIL_SERVER_HOST,EMAIL_SERVER_PORT,EMAIL_SERVER_USER,EMAIL_SERVER_PASSWORD
          script: |
            set -e

            cd "$VPS_APP_DIR"

            umask 077
            cat > .env.production <<EOF
            NEXT_PUBLIC_EXTERNAL_URL=$NEXT_PUBLIC_EXTERNAL_URL
            NEXT_PUBLIC_BASIC_URL=$NEXT_PUBLIC_BASIC_URL
            DOMAIN=$DOMAIN
            MONGO_INITDB_ROOT_USERNAME=$MONGO_INITDB_ROOT_USERNAME
            MONGO_INITDB_ROOT_PASSWORD=$MONGO_INITDB_ROOT_PASSWORD
            MONGODB_URI=$MONGODB_URI
            JWT_SECRET=$JWT_SECRET
            EMAIL_SERVER_HOST=$EMAIL_SERVER_HOST
            EMAIL_SERVER_PORT=$EMAIL_SERVER_PORT
            EMAIL_SERVER_USER=$EMAIL_SERVER_USER
            EMAIL_SERVER_PASSWORD=$EMAIL_SERVER_PASSWORD
            EOF
            chmod 600 .env.production

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' nextjs_app_prod 2>/dev/null || true)"

            export APP_IMAGE="$APP_IMAGE"

            docker compose -f docker-compose.vps.yml --env-file .env.production pull
            docker compose -f docker-compose.vps.yml --env-file .env.production up -d --remove-orphans

            DEPLOY_OK=0
            for i in $(seq 1 24); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nextjs_app_prod 2>/dev/null || true)"
              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
                DEPLOY_OK=1
                break
              fi
              sleep 5
            done

            if [ "$DEPLOY_OK" -ne 1 ]; then
              echo "Deploy healthcheck failed. Starting rollback..."
              if [ -n "$PREVIOUS_IMAGE" ]; then
                export APP_IMAGE="$PREVIOUS_IMAGE"
                docker compose -f docker-compose.vps.yml --env-file .env.production up -d --remove-orphans
                echo "Rollback completed to image: $PREVIOUS_IMAGE"
              else
                echo "No previous image found, rollback skipped."
              fi
              exit 1
            fi

            echo "Deploy healthcheck passed."
