name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BUILD_MONGODB_URI: mongodb://127.0.0.1:27017/new-twitter-clone-build

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies for seed
        run: npm ci

      - name: Set image names
        id: image
        run: |
          IMAGE_REPO="${GITHUB_REPOSITORY,,}"
          IMAGE_SHA="${{ env.REGISTRY }}/${IMAGE_REPO}:${GITHUB_SHA}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${IMAGE_REPO}:latest"
          echo "image_sha=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Wait for MongoDB service
        run: |
          MONGO_ID="$(docker ps --filter 'ancestor=mongo:latest' --format '{{.ID}}' | head -n 1)"
          for i in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$MONGO_ID")"
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then echo "MongoDB is ready"; exit 0; fi
            sleep 2
          done
          exit 1

      - name: Seed MongoDB data
        env:
          MONGODB_URI: ${{ env.BUILD_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
          NEXT_PUBLIC_EXTERNAL_URL: ${{ secrets.NEXT_PUBLIC_EXTERNAL_URL }}
          NEXT_PUBLIC_BASIC_URL: ${{ secrets.NEXT_PUBLIC_BASIC_URL }}
        run: npm run seed

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_sha }}
            ${{ steps.image.outputs.image_latest }}
          build-args: |
            NEXT_PUBLIC_EXTERNAL_URL=${{ secrets.NEXT_PUBLIC_EXTERNAL_URL }}
            NEXT_PUBLIC_BASIC_URL=${{ secrets.NEXT_PUBLIC_BASIC_URL }}
            MONGODB_URI=${{ env.BUILD_MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EMAIL_SERVER_HOST=${{ secrets.EMAIL_SERVER_HOST }}
            EMAIL_SERVER_PORT=${{ secrets.EMAIL_SERVER_PORT }}
            EMAIL_SERVER_USER=${{ secrets.EMAIL_SERVER_USER }}
            EMAIL_SERVER_PASSWORD=${{ secrets.EMAIL_SERVER_PASSWORD }}
            REDIS_URL=redis://redis:6379

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: .
          exclude: .git,.github,node_modules
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE_TWITTER: ghcr.io/${{ github.repository }}:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"

            cat > .env.production <<EOF
            DOMAIN_TWITTER=${{ secrets.DOMAIN_TWITTER }}
            NEXT_PUBLIC_BASIC_URL=${{ secrets.NEXT_PUBLIC_BASIC_URL }}
            APP_IMAGE_TWITTER=$APP_IMAGE_TWITTER
            MONGODB_URI=mongodb://${{ secrets.MONGO_INITDB_ROOT_USERNAME }}:${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}@mongodb_prod:27017/admin?authSource=admin
            MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
            MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_URL=redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379
            EMAIL_SERVER_HOST=${{ secrets.EMAIL_SERVER_HOST }}
            EMAIL_SERVER_PORT=${{ secrets.EMAIL_SERVER_PORT }}
            EMAIL_SERVER_USER=${{ secrets.EMAIL_SERVER_USER }}
            EMAIL_SERVER_PASSWORD=${{ secrets.EMAIL_SERVER_PASSWORD }}
            EOF
            chmod 600 .env.production

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin


            docker compose -f docker-compose.vps.yml --env-file .env.production --project-name twitter-prod pull
            docker compose -f docker-compose.vps.yml --env-file .env.production --project-name twitter-prod up -d --force-recreate

            docker system prune -f
            
            echo "Deployment finished successfully."