name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BUILD_MONGODB_URI: mongodb://127.0.0.1:27017/new-twitter-clone-build

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies for seed
        run: npm ci

      - name: Set image names
        id: image
        run: |
          IMAGE_REPO="${GITHUB_REPOSITORY,,}"
          IMAGE_SHA="${{ env.REGISTRY }}/${IMAGE_REPO}:${GITHUB_SHA}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${IMAGE_REPO}:latest"
          echo "image_sha=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Wait for MongoDB service
        run: |
          MONGO_ID="$(docker ps --filter 'ancestor=mongo:latest' --format '{{.ID}}' | head -n 1)"
          if [ -z "$MONGO_ID" ]; then
            echo "MongoDB service container not found"
            exit 1
          fi

          for i in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$MONGO_ID")"
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
              echo "MongoDB is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become ready in time"
          exit 1

      - name: Seed MongoDB data for build
        env:
          MONGODB_URI: ${{ env.BUILD_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
          NEXT_PUBLIC_EXTERNAL_URL: ${{ secrets.NEXT_PUBLIC_EXTERNAL_URL }}
          NEXT_PUBLIC_BASIC_URL: ${{ secrets.NEXT_PUBLIC_BASIC_URL }}
        run: npm run seed

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          network: host
          push: true
          tags: |
            ${{ steps.image.outputs.image_sha }}
            ${{ steps.image.outputs.image_latest }}
          build-args: |
            NEXT_PUBLIC_EXTERNAL_URL=${{ secrets.NEXT_PUBLIC_EXTERNAL_URL }}
            NEXT_PUBLIC_BASIC_URL=${{ secrets.NEXT_PUBLIC_BASIC_URL }}
            MONGODB_URI=${{ env.BUILD_MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EMAIL_SERVER_HOST=${{ secrets.EMAIL_SERVER_HOST }}
            EMAIL_SERVER_PORT=${{ secrets.EMAIL_SERVER_PORT }}
            EMAIL_SERVER_USER=${{ secrets.EMAIL_SERVER_USER }}
            EMAIL_SERVER_PASSWORD=${{ secrets.EMAIL_SERVER_PASSWORD }}
            REDIS_URL=redis://redis:6379

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      APP_IMAGE_TWITTER: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure VPS app directory exists
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: VPS_APP_DIR
          script: |
            mkdir -p "$(printf '%s' "$VPS_APP_DIR" | tr -d '\r\n')"

      - name: Sync deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: docker-compose.vps.yml,Caddyfile,Dockerfile.socket,package.json,package-lock.json,socket
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE_TWITTER: ${{ env.APP_IMAGE_TWITTER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DOMAIN_TWITTER: ${{ secrets.DOMAIN_TWITTER }}
          NEXT_PUBLIC_BASIC_URL: ${{ secrets.NEXT_PUBLIC_BASIC_URL }}
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: APP_IMAGE_TWITTER,GHCR_USERNAME,GHCR_TOKEN,VPS_APP_DIR,DOMAIN_TWITTER,NEXT_PUBLIC_BASIC_URL,MONGO_INITDB_ROOT_USERNAME,MONGO_INITDB_ROOT_PASSWORD,MONGODB_URI,JWT_SECRET,REDIS_PASSWORD,EMAIL_SERVER_HOST,EMAIL_SERVER_PORT,EMAIL_SERVER_USER,EMAIL_SERVER_PASSWORD
          script: |
            set -e
            VPS_APP_DIR="$(printf '%s' "$VPS_APP_DIR" | tr -d '\r\n')"

            cd "$VPS_APP_DIR"

            if [ -z "$DOMAIN_TWITTER" ]; then
              echo "DOMAIN_TWITTER is empty. Set the secret in the twitter repository."
              exit 1
            fi
            if [ -z "$NEXT_PUBLIC_BASIC_URL" ]; then
              echo "NEXT_PUBLIC_BASIC_URL is empty. Set this secret in the twitter repository."
              exit 1
            fi
            if [ -z "$MONGODB_URI" ] || [ -z "$JWT_SECRET" ]; then
              echo "MONGODB_URI or JWT_SECRET is empty. Set required secrets in the twitter repository."
              exit 1
            fi
            if [ -z "$REDIS_PASSWORD" ]; then
              echo "REDIS_PASSWORD is empty. Set required Redis secret in the twitter repository."
              exit 1
            fi
            if [ -z "$MONGO_INITDB_ROOT_USERNAME" ] || [ -z "$MONGO_INITDB_ROOT_PASSWORD" ]; then
              echo "MONGO_INITDB_ROOT_USERNAME or MONGO_INITDB_ROOT_PASSWORD is empty. Set required Mongo root secrets in the twitter repository."
              exit 1
            fi

            MONGODB_URI_EFFECTIVE="$MONGODB_URI"
            if echo "$MONGODB_URI_EFFECTIVE" | grep -Eq 'mongodb://([^@/]+@)?(localhost|127\.0\.0\.1)(:[0-9]+)?/'; then
              MONGODB_URI_EFFECTIVE="$(echo "$MONGODB_URI_EFFECTIVE" | sed -E 's#(mongodb://([^@/]+@)?)(localhost|127\.0\.0\.1)(:[0-9]+)?/#\1mongodb_prod\4/#')"
              echo "MONGODB_URI host normalized to mongodb_prod for container networking."
            fi

            # Always derive runtime URI from Mongo root secrets to avoid stale URI credentials.
            MONGODB_URI_EFFECTIVE="mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb_prod:27017/admin?authSource=admin"
            MONGO_CHECK_URI="mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin?authSource=admin"
            REDIS_URL_EFFECTIVE="redis://:${REDIS_PASSWORD}@redis:6379"

            if [ ! -f docker-compose.vps.yml ] || [ ! -f Caddyfile ]; then
              echo "docker-compose.vps.yml or Caddyfile not found in VPS_APP_DIR. Run infra deploy first."
              exit 1
            fi

            # If .env.production does not exist, create with DOMAIN_TWITTER from secrets
            if [ ! -f .env.production ]; then
              umask 077
              printf 'DOMAIN_TWITTER=%s\n' "$DOMAIN_TWITTER" > .env.production
              chmod 600 .env.production
              echo ".env.production created with DOMAIN_TWITTER from secrets."
            fi

            update_env() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" .env.production; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env.production
              else
                printf '\n%s=%s\n' "$KEY" "$VALUE" >> .env.production
              fi
            }

            update_env DOMAIN_TWITTER "$DOMAIN_TWITTER"
            update_env NEXT_PUBLIC_BASIC_URL "$NEXT_PUBLIC_BASIC_URL"
            update_env APP_IMAGE_TWITTER "$APP_IMAGE_TWITTER"
            update_env MONGODB_URI "$MONGODB_URI_EFFECTIVE"
            update_env MONGO_INITDB_ROOT_USERNAME "$MONGO_INITDB_ROOT_USERNAME"
            update_env MONGO_INITDB_ROOT_PASSWORD "$MONGO_INITDB_ROOT_PASSWORD"
            update_env JWT_SECRET "$JWT_SECRET"
            update_env REDIS_PASSWORD "$REDIS_PASSWORD"
            update_env REDIS_URL "$REDIS_URL_EFFECTIVE"
            update_env EMAIL_SERVER_HOST "$EMAIL_SERVER_HOST"
            update_env EMAIL_SERVER_PORT "$EMAIL_SERVER_PORT"
            update_env EMAIL_SERVER_USER "$EMAIL_SERVER_USER"
            update_env EMAIL_SERVER_PASSWORD "$EMAIL_SERVER_PASSWORD"

            chmod 600 .env.production

            SERVICES="$(docker compose -f docker-compose.vps.yml --env-file .env.production --project-name twitter-prod config --services || true)"
            if ! echo "$SERVICES" | grep -qx "redis"; then
              echo "Service 'redis' not found in docker-compose.vps.yml on VPS."
              echo "Detected services:"
              echo "$SERVICES"
              exit 1
            fi
            if ! echo "$SERVICES" | grep -qx "socket-server"; then
              echo "Service 'socket-server' not found in docker-compose.vps.yml on VPS."
              echo "Detected services:"
              echo "$SERVICES"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # Ensure existing mongo container is available for the app.
            if docker inspect mongodb_prod >/dev/null 2>&1; then
              MONGO_STATE="$(docker inspect --format='{{.State.Status}}' mongodb_prod 2>/dev/null || true)"
              if [ "$MONGO_STATE" != "running" ]; then
                docker start mongodb_prod >/dev/null
                echo "mongodb_prod started."
              fi
            else
              echo "mongodb_prod container not found on VPS. Bootstrap shared stack first (infra deploy + initial stack up)."
              exit 1
            fi

            # Validate Mongo auth before deploying app container.
            if ! docker exec mongodb_prod mongosh "$MONGO_CHECK_URI" --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
              echo "Mongo authentication check failed. Existing Mongo data volume may use different credentials than current secrets."
              echo "Recent Mongo logs:"
              docker logs --tail 120 mongodb_prod || true
              exit 1
            fi

            COMPOSE="docker compose -f docker-compose.vps.yml --env-file .env.production --project-name twitter-prod"

            $COMPOSE pull nextjs-twitter

            if docker inspect redis_prod >/dev/null 2>&1; then
              REDIS_STATE="$(docker inspect --format='{{.State.Status}}' redis_prod 2>/dev/null || true)"
              if [ "$REDIS_STATE" != "running" ]; then
                docker start redis_prod >/dev/null
                echo "redis_prod started."
              fi
            else
              $COMPOSE up -d --no-deps redis
            fi

            TARGET_NET="twitter-prod_app_network"
            docker network inspect "$TARGET_NET" >/dev/null 2>&1 || docker network create "$TARGET_NET"
            docker network connect "$TARGET_NET" redis_prod >/dev/null 2>&1 || true
            docker network connect "$TARGET_NET" mongodb_prod >/dev/null 2>&1 || true

            if docker inspect socket_server_prod >/dev/null 2>&1; then
              SOCKET_STATE="$(docker inspect --format='{{.State.Status}}' socket_server_prod 2>/dev/null || true)"
              if [ "$SOCKET_STATE" != "running" ]; then
                docker start socket_server_prod >/dev/null
                echo "socket_server_prod started."
              fi
            else
              $COMPOSE up -d --no-deps socket-server
            fi

            docker network connect "$TARGET_NET" socket_server_prod >/dev/null 2>&1 || true

            if docker inspect nextjs_twitter_prod >/dev/null 2>&1; then
              APP_STATE="$(docker inspect --format='{{.State.Status}}' nextjs_twitter_prod 2>/dev/null || true)"
              if [ "$APP_STATE" != "running" ]; then
                docker start nextjs_twitter_prod >/dev/null
                echo "nextjs_twitter_prod started."
              fi
            else
              $COMPOSE up -d --no-deps nextjs-twitter
            fi

            docker network connect "$TARGET_NET" nextjs_twitter_prod >/dev/null 2>&1 || true

            if docker inspect caddy_proxy >/dev/null 2>&1; then
              CADDY_STATE="$(docker inspect --format='{{.State.Status}}' caddy_proxy 2>/dev/null || true)"
              if [ "$CADDY_STATE" != "running" ]; then
                docker start caddy_proxy >/dev/null
                echo "caddy_proxy started."
              fi
            else
              $COMPOSE up -d --no-deps caddy
            fi

            docker network connect "$TARGET_NET" caddy_proxy >/dev/null 2>&1 || true

            DEPLOY_OK=0
            for i in $(seq 1 36); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nextjs_twitter_prod 2>/dev/null || true)"
              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
                DEPLOY_OK=1
                break
              fi
              sleep 5
            done

            if [ "$DEPLOY_OK" -ne 1 ]; then
              echo "Deploy healthcheck failed."
              echo "Container state:"
              docker inspect --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}} exit={{.State.ExitCode}} restarting={{.State.Restarting}}' nextjs_twitter_prod || true
              echo "Recent container logs:"
              docker logs --tail 120 nextjs_twitter_prod || true
              echo "Mongo container state:"
              docker inspect --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}} exit={{.State.ExitCode}} restarting={{.State.Restarting}}' mongodb_prod || true
              echo "Mongo networks:"
              docker inspect --format='{{range $k,$v := .NetworkSettings.Networks}}{{printf "%s\n" $k}}{{end}}' mongodb_prod || true
              exit 1
            fi

            echo "Deploy healthcheck passed."
