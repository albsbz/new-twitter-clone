services:
  socket-server:
    build:
      context: .
      dockerfile: Dockerfile.socket
    container_name: socket_server_prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis_prod:6379
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_BASIC_URL: ${NEXT_PUBLIC_BASIC_URL}
    expose:
      - "4000"
    networks:
      - infra_app_network

  nextjs-twitter:
    image: ${APP_IMAGE_TWITTER:?APP_IMAGE_TWITTER is required}
    container_name: nextjs_twitter_prod
    restart: unless-stopped
    depends_on:
      socket-server:
        condition: service_started
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis_prod:6379
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - infra_app_network

networks:
  infra_app_network:
    external: true
    name: infra_app_network
