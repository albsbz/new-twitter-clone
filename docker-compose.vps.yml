version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: mongodb_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    env_file:
      - .env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  nextjs:
    image: ${APP_IMAGE:-ghcr.io/owner/repo:latest}
    container_name: nextjs_app_prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
