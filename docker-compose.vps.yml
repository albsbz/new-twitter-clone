services:
  mongo:
    image: mongo:latest
    container_name: mongodb_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    env_file:
      - .env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis_prod
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '$${REDIS_PASSWORD}' ping | grep -q PONG",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  socket-server:
    build:
      context: .
      dockerfile: Dockerfile.socket
    container_name: socket_server_prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_BASIC_URL: ${NEXT_PUBLIC_BASIC_URL}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  nextjs-twitter:
    image: ${APP_IMAGE_TWITTER:?APP_IMAGE_TWITTER is required}
    container_name: nextjs_twitter_prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-server:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  nextjs-landing:
    image: ${APP_IMAGE_LANDING:?APP_IMAGE_LANDING is required}
    container_name: nextjs_landing_prod
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    depends_on:
      nextjs-twitter:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
