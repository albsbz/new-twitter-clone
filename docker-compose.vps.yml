services:
  # 1. База данных
  mongo:
    image: mongo:latest
    container_name: mongodb_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    env_file:
      - .env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 2. Redis (кэш и шина событий)
  redis:
    image: redis:7-alpine
    container_name: redis_prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # 3. Socket.io сервер
  socket-server:
    build:
      context: .
      dockerfile: Dockerfile.socket
    container_name: socket_server_prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    env_file:
      - .env.production
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 4. Основное приложение (Next.js)
  nextjs-twitter:
    image: ${APP_IMAGE_TWITTER}
    container_name: nextjs_twitter_prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      socket-server:
        condition: service_healthy
    env_file:
      - .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 5. Лендинг (Next.js)
  nextjs-landing:
    image: ${APP_IMAGE_LANDING}
    container_name: nextjs_landing_prod
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 6. Прокси-сервер (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    depends_on:
      nextjs-twitter:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge